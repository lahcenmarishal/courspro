<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="90" height="90" rx="18" fill="url(#grad)"/>
  <!-- Graduation Cap Icon -->
  <g fill="white" transform="translate(50, 50)">
    <!-- Cap top (diamond shape) -->
    <polygon points="0,-22 28,-10 0,2 -28,-10" />
    <!-- Cap base/band -->
    <path d="M-20,-6 L-20,8 Q0,18 20,8 L20,-6 Q0,4 -20,-6" />
    <!-- Tassel -->
    <line x1="22" y1="-10" x2="28" y2="10" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <circle cx="28" cy="12" r="4" />
  </g>
</svg>
